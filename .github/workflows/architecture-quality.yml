name: architecture-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    # Use the current GA image; Ubuntu24 rejected the required private-loopback setup.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out architecture
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned decision source repositories
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: agentic-delivery-lab/agentic-delivery
          ref: c6c891fa937b7db06e3925c3e83ea83656b3d617
          path: sources/control-plane
          persist-credentials: false
      - name: Verify current Customizations repository identity
        env:
          GH_TOKEN: ${{ github.token }}
          IDENTITY_PATH: ${{ runner.temp }}/customizations-repository.json
        run: |
          set -euo pipefail
          gh api repos/agentic-delivery-lab/agentic-delivery-agent-customizations > "$IDENTITY_PATH"
          node tools/validate-customizations-identity.mjs "$IDENTITY_PATH"
      - name: Check out pinned Primitive decision source from Agent Customizations
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: agentic-delivery-lab/agentic-delivery-agent-customizations
          ref: e4933566fbf5b0f593830f8933f18fbd21024fa7
          path: sources/primitives
          persist-credentials: false
      - name: Check out pinned Distribution decision source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: agentic-delivery-lab/agentic-delivery-distribution
          ref: b69c5710928b47efc4d3ab12ec4d5b596c80720c
          path: sources/distribution
          persist-credentials: false
      - name: Read admitted Requirements pin
        id: requirements-pin
        run: |
          node --input-type=module <<'JS'
          import { readFile, appendFile } from 'node:fs/promises';
          const pin = JSON.parse(await readFile('architecture/references/requirements.lock.json', 'utf8'));
          if (pin.repository !== 'agentic-delivery-lab/agentic-delivery-requirements' || pin.repositoryId !== 1416207421 || !/^[0-9a-f]{40}$/.test(pin.commit)) throw new Error('Invalid immutable Requirements identity/pin');
          await appendFile(process.env.GITHUB_OUTPUT, `commit=${pin.commit}\n`);
          JS
      - name: Check out exact Requirements baseline source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: agentic-delivery-lab/agentic-delivery-requirements
          ref: ${{ steps.requirements-pin.outputs.commit }}
          path: sources/requirements
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.3.4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Prepare stock isolated Structurizr runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          bwrap --version
          python3 --version
          sha256sum /usr/bin/bwrap /usr/bin/python3
          pnpm architecture:prepare
      - name: Verify sandbox ownership and platform boundaries
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_structurizr_*.py'
      - name: Verify actual host isolation and deadline cleanup
        run: python3 tests/structurizr-isolation.py
      - name: Validate arc42 and architecture contracts
        run: pnpm architecture:check
      - name: Verify deterministic Architecture content digest
        run: node tools/architecture-content-digest.mjs . HEAD
      - name: Validate history-preserving extraction manifest
        run: pnpm migration:check
      - name: Run architecture tests
        run: pnpm test
      - name: Retain advisory inspections and selected model exports
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: structurizr-validation-report
          path: .cache/structurizr/last-report.json
          include-hidden-files: true
          if-no-files-found: error
