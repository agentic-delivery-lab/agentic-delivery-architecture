schemaVersion: 3
contexts:
  - id: agentic-delivery-governance
    name: Agentic Delivery Governance
    definition: Repository delivery governance and reusable rules for proposing, reviewing, validating, and recording work.
    canonicalLanguageSource:
      repository: agentic-delivery-lab/agentic-delivery-architecture
      path: architecture/domain/ubiquitous-language.yml
    contextStewardRepository:
      repository: agentic-delivery-lab/agentic-delivery
      repositoryId: 1358455028
      evidenceRepository: control-plane
      evidencePath: docs/domain/ubiquitous-language.yml
  - id: agentic-delivery-control-plane
    name: Agentic Delivery Control Plane
    definition: The delivery controller, event intake, enrollment, lifecycle contracts, orchestration, and authorized GitHub write-back.
    repository: agentic-delivery-lab/agentic-delivery
    canonicalLanguageSource:
      repository: agentic-delivery-lab/agentic-delivery-architecture
      path: architecture/domain/ubiquitous-language.yml
    contextStewardRepository:
      repository: agentic-delivery-lab/agentic-delivery
      repositoryId: 1358455028
      evidenceRepository: control-plane
      evidencePath: docs/domain/ubiquitous-language.yml
  - id: agentic-primitives
    name: Agentic Primitives
    definition: The versioned catalog of reusable agent capabilities and contracts, with immutable release and projection rules.
    repository: agentic-delivery-lab/agentic-delivery-primitives
    evidence: ADP-0001 and manifests/primitive-catalog.yml at the pinned source revision.
    canonicalLanguageSource:
      repository: agentic-delivery-lab/agentic-delivery-architecture
      path: architecture/domain/ubiquitous-language.yml
    contextStewardRepository:
      repository: agentic-delivery-lab/agentic-delivery-primitives
      repositoryId: 1380894656
      evidenceRepository: primitives
      evidencePath: manifests/primitive-catalog.yml
  - id: developer-distribution
    name: Developer Distribution
    definition: The reproducible bootstrap, bundle, and thin consumer-integration model for installing pinned delivery artifacts.
    repository: agentic-delivery-lab/agentic-delivery-distribution
    evidence: ADD-0001 and manifests/workflow-bundle.json at the pinned source revision.
    canonicalLanguageSource:
      repository: agentic-delivery-lab/agentic-delivery-architecture
      path: architecture/domain/ubiquitous-language.yml
    contextStewardRepository:
      repository: agentic-delivery-lab/agentic-delivery-distribution
      repositoryId: 1380894705
      evidenceRepository: distribution
      evidencePath: manifests/workflow-bundle.json

crossContextAuthority:
  id: architecture-authority
  repository: agentic-delivery-lab/agentic-delivery-architecture
  classification: cross-context authority, not a bounded context
  owns: [principles, architecture-description, organization-decision-text, context-map, conformance]

repositoryAdapters:
  - id: public-github-adapter
    repository: agentic-delivery-lab/.github
    classification: GitHub repository adapter, not a bounded context
    owns: [public-profile, community-health, issue-form-artifacts, pull-request-template]
  - id: private-github-adapter
    repository: agentic-delivery-lab/.github-private
    classification: GitHub repository adapter, not a bounded context
    owns: [member-profile, promoted-agent-projections, publication-provenance]
