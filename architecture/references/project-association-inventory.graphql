query {
  viewer {
    login
    projectsV2(first: 100) {
      totalCount
      pageInfo { hasNextPage endCursor }
      nodes { id number public closed }
    }
  }
  organization(login: "agentic-delivery-lab") {
    projectsV2(first: 100) {
      totalCount
      pageInfo { hasNextPage endCursor }
      nodes { id number public closed }
    }
    repositories(first: 20) {
      totalCount
      pageInfo { hasNextPage endCursor }
      nodes {
        nameWithOwner
        databaseId
        visibility
        projectsV2(first: 100) {
          totalCount
          pageInfo { hasNextPage endCursor }
          nodes { id number public closed }
        }
        issues(first: 100, orderBy: { field: CREATED_AT, direction: ASC }) {
          totalCount
          pageInfo { hasNextPage endCursor }
          nodes {
            id number state
            projectItems(first: 100) {
              totalCount
              pageInfo { hasNextPage endCursor }
              nodes { id project { id number public closed } }
            }
          }
        }
      }
    }
  }
}
