  - id: control-plane-codex-instruction-context-20261009-1622
    observedAt: '2026-10-09T16:22:00Z'
    sourceRepositories: [control-plane]
    sourceCommit: 67e5941a9bb594cab5c9cd2da0bead4caa7b6bbf
    sourcePath: >-
      .github/workflows/issue-intake.yml; .github/workflows/codex-delivery.yml;
      scripts/codex-delivery.mjs; scripts/lib/codex-client.mjs;
      scripts/setup-runner-codex.mjs; .agents/codex-delivery.md
    result: >-
      Static source review found that the issue-delivery workflow and app-server
      start from the controller checkout, while Codex threads start or resume
      in a per-repository/per-Issue workspace containing the source repository's
      main checkout. The controller reads .agents/codex-delivery.md from its
      own checkout and supplies it as developer instructions; Issue text is
      marked untrusted. The pinned client disables plugins and apps. The exact
      main pin installs Codex CLI 0.159.3. An isolated fixture using that CLI
      loaded root and current-directory AGENTS.md instructions, excluded a
      nested AGENTS.md when run at the project root, and excluded instructions
      above the .git project root.
    limitation: >-
      This combines static source inspection with a local isolated CLI fixture;
      it is not an Actions-run observation, a production Vercel request, proof
      that every customization is propagated, a prompt-injection resistance
      test, or evidence of successful live issue delivery.
