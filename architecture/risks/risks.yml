schemaVersion: 2
risks:
  - id: R-001
    title: Organization issue-field pinning and visibility are unverified
    status: open
    owner: organization-operator
    evidence: system-evidence.yml#organization-issue-fields
    mitigation: Verify field pinning on every intended native Issue Type and issues without a type; separately verify visibility and issue-value reads/writes with test issues.
  - id: R-002
    title: App installation access and Control Plane contract differ
    status: open
    owner: control-plane-maintainer
    evidence: system-evidence.yml#invoker-installation
    mitigation: Bind the exact installation to the controller identity, reconcile access and event expectations in a reviewed Control Plane change, and test before activation.
  - id: R-003
    title: Recovery issue intake fails before dependency installation
    status: open
    owner: control-plane-maintainer
    evidence: system-evidence.yml#recovery-issue-intake-runs
    mitigation: Correct the classify-job checkout path in its issue-linked branch, validate permissions and workflow tests, then observe a new shadow run.
  - id: R-004
    title: Participants have no end-to-end live delivery evidence
    status: open
    owner: control-plane-maintainer
    evidence: system-evidence.yml#participant-modes-and-release-pins
    mitigation: Keep all participants in shadow mode until event identity, field reads, deterministic gates, origin-only write-back, evidence publication, upgrade, and rollback are independently observed.
  - id: R-005
    title: Primitive main release manifest references an unresolved source commit
    status: open
    owner: primitive-maintainer
    evidence: system-evidence.yml#primitive-and-distribution-drafts
    mitigation: Correct Primitive release provenance and validate the source commit and digest before the next Architecture/Distribution pin.
  - id: R-006
    title: Private adapter enforcement and publication entitlement are unknown
    status: open
    owner: organization-operator
    evidence: system-evidence.yml#public-and-private-adapters
    mitigation: Confirm plan entitlement, live ruleset state, profile rendering, and an approved agent projection with an operator; do not infer absence from the 403 response.
  - id: R-007
    title: Repository-scoped required checks may be mistaken for organization-wide protection
    status: open
    owner: organization-maintainer
    evidence: system-evidence.yml#repository-releases-and-rulesets
    mitigation: Audit each repo's live rulesets and branch settings separately and state the observation boundary in every review.
  - id: R-009
    title: Documentation tooling and diagram renderers are not fully reproducible
    status: open
    owner: architecture-maintainer
    evidence: architecture/references/tooling-lock.json
    mitigation: Keep sources readable without rendering; pin and verify tools before relying on generated output or activating a rendering pipeline.
  - id: R-010
    title: ADR and generated artifact provenance can drift across repository owners
    status: open
    owner: architecture-maintainer
    relatedQualityScenario: QR-010
    evidence: [architecture/references/decision-inventory.yml, system-evidence.yml#primitive-and-distribution-drafts]
    mitigation: Validate repository identity, immutable source commits, original paths, per-file hashes, link-only adaptations, release digests for canonical Architecture records, and generated artifact manifests before activation.
  - id: R-011
    title: Context steward review cannot be independently enforced with the current approval gate
    status: open
    owner: organization-maintainer
    relatedQualityScenario: QR-011
    evidence: [architecture/domain/bounded-contexts.yml, system-evidence.yml#repositories, recovery issue #59]
    mitigation: Keep repository mapping as review routing only; an authorized maintainer must resolve the one-member/CODEOWNERS limitation and verify actual human reviews before claiming enforcement.
