schemaVersion: 2
risks:
  - id: R-001
    title: Organization issue-field pinning and visibility are unverified
    status: open
    owner: organization-operator
    evidence: system-evidence.yml#organization-issue-fields
    mitigation: Verify field pinning on every intended native Issue Type and issues without a type; separately verify visibility and issue-value reads/writes with test issues.
  - id: R-002
    title: App installation access and Control Plane contract differ
    status: open
    owner: control-plane-maintainer
    evidence: system-evidence.yml#invoker-installation
    mitigation: Bind the exact installation to the controller identity, reconcile access and event expectations in a reviewed Control Plane change, and test before activation.
  - id: R-003
    title: Recovery issue intake fails before dependency installation
    status: open
    owner: control-plane-maintainer
    evidence: system-evidence.yml#recovery-issue-intake-runs
    mitigation: Correct the classify-job checkout path in its issue-linked branch, validate permissions and workflow tests, then observe a new shadow run.
  - id: R-004
    title: Participants have no end-to-end live delivery evidence
    status: open
    owner: control-plane-maintainer
    evidence: system-evidence.yml#participant-modes-and-release-pins
    mitigation: Keep all participants in shadow mode until event identity, field reads, deterministic gates, origin-only write-back, evidence publication, upgrade, and rollback are independently observed.
  - id: R-005
    title: Primitive main release manifest references an unresolved source commit
    status: open
    owner: primitive-maintainer
    evidence: system-evidence.yml#primitive-and-distribution-drafts
    mitigation: Correct Primitive release provenance and validate the source commit and digest before the next Architecture/Distribution pin.
  - id: R-006
    title: Private adapter ruleset access is plan-limited and publication eligibility remains unknown
    status: open
    owner: organization-operator
    evidence: [system-evidence.yml#current-organization-capability-inventory-20261009-1044, system-evidence.yml#public-and-private-adapters]
    mitigation: Confirm entitlement and live ruleset state with an authorized operator; do not infer ruleset absence from the plan-related 403 or change publication settings without separate authorization.
  - id: R-007
    title: Repository-scoped required checks may be mistaken for organization-wide protection
    status: open
    owner: organization-maintainer
    evidence: system-evidence.yml#repository-releases-and-rulesets
    mitigation: Audit each repo's live rulesets and branch settings separately and state the observation boundary in every review.
  - id: R-009
    title: Documentation tooling and diagram renderers are not fully reproducible
    status: open
    owner: architecture-maintainer
    evidence: architecture/references/tooling-lock.json
    mitigation: Keep sources readable without rendering; pin and verify tools before relying on generated output or activating a rendering pipeline.
  - id: R-010
    title: ADR and generated artifact provenance can drift across repository owners
    status: open
    owner: architecture-maintainer
    relatedQualityScenario: QR-010
    evidence: [architecture/references/decision-inventory.yml, system-evidence.yml#primitive-and-distribution-drafts]
    mitigation: Validate repository identity, immutable source commits, original paths, per-file hashes, declared source-preserving transformations, release digests for canonical Architecture records, and generated artifact manifests before activation.
  - id: R-011
    title: Context steward review cannot be independently enforced with the current approval gate
    status: open
    owner: organization-maintainer
    relatedQualityScenario: QR-011
    evidence: [architecture/domain/bounded-contexts.yml, system-evidence.yml#repositories, "recovery issue #59"]
    mitigation: Keep repository mapping as review routing only; an authorized maintainer must resolve the one-member/CODEOWNERS limitation and verify actual human reviews before claiming enforcement.
  - id: R-012
    title: No Project is visible despite reported organization Projects capability
    status: open
    owner: organization-operator
    relatedQualityScenario: QR-013
    evidence: [system-evidence.yml#project-inventory-20261009-1153, system-evidence.yml#organization-issue-fields]
    mitigation: Use the complete empty inventory and positive feature-capability flags to support the human topology decision; verify Project ownership, access, and field visibility before configuration. Keep App access separately unverified before any write integration.
  - id: R-013
    title: Organization Actions policy does not require immutable action pins and App access is unverified
    status: open
    owner: organization-operator
    evidence: system-evidence.yml#current-organization-capability-inventory-20261009-1044
    mitigation: Inspect repository-level Actions policy and every workflow reference before claiming pinning; verify the App installation through an App-authenticated read path before relying on its permissions.
  - id: R-014
    title: Future evaluation tooling could depend on vendor products scheduled for retirement
    status: open
    owner: agentic-primitives-context-steward
    evidence: architecture/references/strategy-research-register.md
    mitigation: Keep the versioned evaluation case and result contracts portable, retain local deterministic replay, and recheck provider lifecycle before any external evaluation integration.
  - id: R-015
    title: Per-run resource limits and usage receipts are not proven end to end
    status: open
    owner: control-plane-maintainer
    relatedQualityScenario: QR-017
    evidence: [architecture/quality/quality-scenarios.yml, "https://github.com/agentic-delivery-lab/agentic-delivery/issues/105"]
    mitigation: Define pinned duration, turn/invocation, retry, and recursion caps in the Control Plane contract; capture admission and terminal usage receipts, test hard-stop behavior, and keep unavailable runtime quota or spend evidence explicitly unknown.
  - id: R-016
    title: Comparative evaluation can be biased by grader drift or case selection
    status: open
    owner: agentic-primitives-context-steward
    relatedQualityScenario: QR-019
    evidence: [architecture/contracts/evaluation-report.schema.json, architecture/evaluation/README.md, "https://github.com/agentic-delivery-lab/agentic-delivery-primitives/issues/3"]
    mitigation: Pin dataset partition, pre-run selection and integrity assessments, require full case coverage and calibration for exact evaluator versions, and keep comparative claims inconclusive without uncontaminated cases, independent graders, and review.
  - id: R-017
    title: Recovery receipts do not yet prove safe behavior across all replay paths
    status: open
    owner: control-plane-maintainer
    relatedQualityScenario: QR-018
    evidence: [architecture/quality/quality-scenarios.yml, system-evidence.yml#participant-modes-and-release-pins, "https://github.com/agentic-delivery-lab/agentic-delivery/issues/105"]
    mitigation: Test webhook delivery replay, Codex session continuation, and evaluation replay as separate mechanisms; require durable operation identity and recovered-or-held disposition with duplicate-write checks.
