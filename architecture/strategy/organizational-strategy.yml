        - No representative validation/holdout corpus, pre-registered case-selection plan, evaluator calibration run, or independent comparison baseline is evidenced.
      contractRefs:
        - architecture/contracts/evaluation-report.schema.json
        - architecture/contracts/conformance-result.schema.json
      implementationIssueRefs:
        - https://github.com/agentic-delivery-lab/agentic-delivery-primitives/issues/3
